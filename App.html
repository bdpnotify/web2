<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบของวันลา (QA/QC BDP)</title>
    <base target="_top">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* ป้องกันแถบสกรอลล์บาร์ซ้อนกัน 2 ชั้น */
        background-color: #f1f5f9;
      }
      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="gasFrame" src="https://script.google.com/macros/s/AKfycbwW90Fj0gzr2ai4_ToASquMxtrP0uTIz7UEvA7ghjGn7yZpfGuGYoHbNsOYS6iI4P-fsg/exec?page=App"></iframe>

    <script>
      (function() {
        var baseUrl = "https://script.google.com/macros/s/AKfycbwW90Fj0gzr2ai4_ToASquMxtrP0uTIz7UEvA7ghjGn7yZpfGuGYoHbNsOYS6iI4P-fsg/exec?page=App";
        var searchParams = window.location.search;
        var ua = navigator.userAgent || "";
        var chromeMatch = ua.match(/Chrome\/(\d+)/);
        var isOldChrome = chromeMatch && parseInt(chromeMatch[1], 10) <= 55;

        // 1. ถ้าพิมพ์ ?mode=legacy ต่อท้ายลิงก์ GitHub ให้ส่งต่อไปที่ iframe ด้วย
        if (searchParams) {
          document.getElementById("gasFrame").src = baseUrl + searchParams;
        } 
        // 2. หรือถ้าเปิดจากเครื่อง Chrome 49 โดยตรง ให้สลับไปหน้า IndexLegacy อัตโนมัติทันที
        else if (isOldChrome) {
          document.getElementById("gasFrame").src = baseUrl + "?mode=legacy";
        }
      })();
    </script>
  </body>
</html>
